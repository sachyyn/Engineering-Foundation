deptrac:
  paths: [./src]
  layers:
    - name: Domain
      collectors:
        - type: classLike
          value: '^App\\[^\\]+\\Domain\\.*'
    - name: Application
      collectors:
        - type: classLike
          value: '^App\\[^\\]+\\Application\\.*'
    - name: Http
      collectors:
        - type: classLike
          value: '^App\\[^\\]+\\Http\\.*'
    - name: Infrastructure
      collectors:
        - type: classLike
          value: '^App\\[^\\]+\\Infrastructure\\.*'
    - name: Framework
      collectors:
        - type: classLike
          value: '^(Symfony|Doctrine)\\.*'
  ruleset:
    Domain: []
    Application: [Domain]
    Http: [Application, Domain, Framework]
    Infrastructure: [Application, Domain, Framework]
